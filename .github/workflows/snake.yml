name: Generate contribution snake arcade

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVG and GIF snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=67E8F9&color_dots=0D1117,312E81,7C3AED,06B6D4,F59E0B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=67E8F9
            dist/github-contribution-grid-snake.gif?color_snake=67E8F9&color_dots=0D1117,312E81,7C3AED,06B6D4,F59E0B

      - name: Publish arcade assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
